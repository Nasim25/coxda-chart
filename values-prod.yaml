# ==============================================================================
# Coxda Microservices Helm Chart - values-prod.yaml (Live / Production Environment)
#
# Usage:
#   helm upgrade --install coxda ./coxda-chart -f values-prod.yaml -n coxda --create-namespace
# ==============================================================================

# গ্লোবাল সেটিংস
global:
  environment: production
  imagePullSecrets:
    - name: dockerhub-secret # যদি Private Docker Hub রিপোজিটরি হয়

# ------------------------------------------------------------------------------
# ১. Coxda Web App (Vue Frontend) -> https://app.yourdomain.com
# ------------------------------------------------------------------------------
app:
  enabled: true
  name: app
  replicaCount: 2 # প্রোডাকশনে হাই-অ্যাভেইলেবিলিটির জন্য ২+ রেপ্লিকা

  image:
    repository: yourdockerhubuser/coxda-app # আপনার Docker Hub ইউজারনেম দিয়ে রিপ্লেস করুন
    pullPolicy: Always
    tag: "latest"

  containerPort: 8080

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20

  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

# ------------------------------------------------------------------------------
# ২. Coxda Auth Service -> https://api.yourdomain.com/auth (or auth.yourdomain.com)
# ------------------------------------------------------------------------------
authService:
  enabled: true
  name: auth
  replicaCount: 2

  image:
    repository: yourdockerhubuser/coxda-auth-service
    pullPolicy: Always
    tag: "latest"

  containerPort: 80

  service:
    type: ClusterIP
    port: 8081
    targetPort: 80

  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi

  livenessProbe:
    httpGet:
      path: /healthz
      port: 80
    initialDelaySeconds: 20
    periodSeconds: 15

  readinessProbe:
    httpGet:
      path: /healthz
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

  config:
    appEnv: "production"
    appDebug: "false"
    appTimezone: "UTC"
    dbConnection: "mysql"
    dbHost: "your-production-db-host.rds.amazonaws.com" # আপনার ক্লাউড ডাটাবেজ হোস্ট
    dbPort: "3306"
    dbDatabase: "coxda_auth_prod"
    redisHost: "your-production-redis-host.com"         # আপনার ক্লাউড রেডিস হোস্ট
    redisPort: "6379"
    cacheDriver: "redis"
    queueConnection: "redis"

  secrets:
    appKey: "base64:PROD_AUTH_APP_KEY_HERE"
    jwtSecret: "PROD_AUTH_JWT_SECRET_HERE"
    dbUsername: "prod_db_user"
    dbPassword: "PROD_STRONG_DB_PASSWORD"
    redisPassword: "PROD_REDIS_PASSWORD"

# ------------------------------------------------------------------------------
# ৩. Coxda Common Service -> https://api.yourdomain.com/common
# ------------------------------------------------------------------------------
commonService:
  enabled: true
  name: common
  replicaCount: 2

  image:
    repository: yourdockerhubuser/coxda-common-service
    pullPolicy: Always
    tag: "latest"

  containerPort: 80

  nginxSidecar:
    enabled: true
    image: nginx:alpine

  service:
    type: ClusterIP
    port: 8082
    targetPort: 80

  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi

  livenessProbe:
    tcpSocket:
      port: 80
    initialDelaySeconds: 20
    periodSeconds: 15

  readinessProbe:
    tcpSocket:
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

  config:
    appEnv: "production"
    appDebug: "false"
    appTimezone: "UTC"
    dbConnection: "mysql"
    dbHost: "your-production-db-host.rds.amazonaws.com"
    dbPort: "3306"
    dbDatabase: "coxda_common_prod"
    redisHost: "your-production-redis-host.com"
    redisPort: "6379"
    cacheDriver: "redis"
    queueConnection: "redis"

  secrets:
    appKey: "base64:PROD_COMMON_APP_KEY_HERE"
    jwtSecret: "PROD_COMMON_JWT_SECRET_HERE"
    dbUsername: "prod_db_user"
    dbPassword: "PROD_STRONG_DB_PASSWORD"
    redisPassword: "PROD_REDIS_PASSWORD"

# ------------------------------------------------------------------------------
# ৪. Ingress (Live Production Domain with Let's Encrypt SSL)
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod" # অটোমেটিক ফ্রি SSL সার্টিফিকেট
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: app.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
          serviceName: app
          servicePort: 8080
    - host: api.yourdomain.com
      paths:
        - path: /auth
          pathType: Prefix
          serviceName: auth
          servicePort: 8081
        - path: /common
          pathType: Prefix
          serviceName: common
          servicePort: 8082
  tls:
    - secretName: coxda-tls-cert
      hosts:
        - app.yourdomain.com
        - api.yourdomain.com
