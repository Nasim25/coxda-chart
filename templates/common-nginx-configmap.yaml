{{- if and .Values.commonService.enabled .Values.commonService.nginxSidecar.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coxda-chart.fullname" . }}-common-nginx-config
  labels:
    {{- include "coxda-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: common
data:
  default.conf: |
    server {
        listen 80;
        index index.php index.html;
        server_name localhost;
        root /var/www/html/public;
        client_max_body_size 50M;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 300;
        }

        location ~ /\.ht {
            deny all;
        }
    }
{{- end }}
